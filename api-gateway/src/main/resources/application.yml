server:
  port: 8080

spring:
  application:
    name: api-gateway
    cloud:
      gateway:
        routes:
          - id: notifications-service
            uri:
              ld: //notification-service
            predicates:
                - Path=/api/notifications/**
            filters:
              - StripPrefix=1
              - name: CircuitBreaker
                args:
                  name: notificationsServiceCircuitBreaker
                  fallbackUri: forward:/fallback/notifications

          - id: user-service
            uri:
              ld: //user-service
            predicates:
              - Path=/api/users/**
            filters:
              - StripPrefix=1
              - name: CircuitBreaker
                args:
                  name: userServiceCircuitBreaker
                  fallbackUri: forward:/fallback/users

      default-filters:
        - PreserveHostHeader
# Настройки порогов срабатывания Resilience4j
resilience4j:
  circuitbreaker:
    instances:
      userServiceCircuitBreaker:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
      orderServiceCircuitBreaker:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
  timelimiter:
    instances:
      userServiceCircuitBreaker:
        timeoutDuration: 3s
      orderServiceCircuitBreaker:
        timeoutDuration: 3s