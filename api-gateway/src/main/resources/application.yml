server:
  port: 8090

spring:
  application:
    name: api-gateway
  main:
    web-application-type: reactive
  config:
    import: "optional:configserver:"
  cloud:
    gateway:
      routes:
        - id: notifications-service
          uri: lb://notification-service
          predicates:
              - Path=/api/notifications/**
          filters:
            - StripPrefix=1
            - name: CircuitBreaker
              args:
                  name: notificationsServiceCircuitBreaker
                  fallbackUri: forward:/fallback/notifications

        - id: user-service
          uri: lb://user-service
          predicates:
              - Path=/api/users/**
          filters:
            - StripPrefix=1
            - name: CircuitBreaker
              args:
                name: userServiceCircuitBreaker
                fallbackUri: forward:/fallback/users

      default-filters:
        - PreserveHostHeader
# Настройки порогов срабатывания Resilience4j
resilience4j:
  circuitbreaker:
    instances:
      userServiceCircuitBreaker:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
      notificationsServiceCircuitBreaker:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
  timelimiter:
    instances:
      userServiceCircuitBreaker:
        timeoutDuration: 3s
      notificationsServiceCircuitBreaker:
        timeoutDuration: 3s