services:
  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    ports:
      - "8090:8090"
    environment:
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka/

    depends_on:
      discovery-service:
        condition: service_healthy
    networks:
      - microservices-net

  config-server:
    build: ./config
    container_name: config-server
    ports:
      - "8888:8888"
    environment:
      SPRING_PROFILES_ACTIVE: native
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka/
    healthcheck:
      test: [ "CMD-SHELL", "wget --spider -q http://localhost:8888 || [ $? -eq 8 ]" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - microservices-net

  discovery-service:
    build: ./registry
    container_name: discovery-service
    ports:
      - "8761:8761"
    environment:
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
    depends_on:
      config-server:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget --spider -q http://localhost:8761 || [ $? -eq 8 ]" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - microservices-net

