server:
  port: 8081

spring:
  application:
    name: notification-service
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: notification-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.value.default.type: com.example.notificationservice.event.UserEvent
        spring.json.use.type.headers: false
        spring.json.trusted.packages: com.example.notificationservice.event
  mail:
    host: localhost
    port: 1025

notification:
  mail:
    from: no-reply@console-app.local
  kafka:
    topic: user-events

logging:
  level:
    com.example.notificationservice: DEBUG
