spring:
  application:
    name: console-app

  datasource:
    url: jdbc:postgresql://localhost:5432/console_app
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

logging:
  level:
    com.example.consoleapp: DEBUG
    org.hibernate.SQL: DEBUG